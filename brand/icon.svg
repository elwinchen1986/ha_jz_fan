<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7FE0"/>
      <stop offset="1" stop-color="#1657C8"/>
    </linearGradient>
    <!-- Blade gradient -->
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEBFF"/>
    </linearGradient>
    <!-- Soft shadow -->
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B3E9A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded square background (fills full canvas) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Fan group (upper-center) -->
  <g transform="translate(256,224)" filter="url(#soft)">
    <!-- Three curved blades, rotated 120 deg each -->
    <g fill="url(#blade)">
      <path d="M0,0 C 34,-92 24,-150 -6,-150 C -40,-150 -34,-96 0,0 Z"
            transform="rotate(0)"/>
      <path d="M0,0 C 34,-92 24,-150 -6,-150 C -40,-150 -34,-96 0,0 Z"
            transform="rotate(120)"/>
      <path d="M0,0 C 34,-92 24,-150 -6,-150 C -40,-150 -34,-96 0,0 Z"
            transform="rotate(240)"/>
    </g>
    <!-- Hub -->
    <circle cx="0" cy="0" r="34" fill="#1657C8"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#FFFFFF" stroke-width="8"/>
    <circle cx="0" cy="0" r="12" fill="#FFFFFF"/>
  </g>

  <!-- "京造" text (lower area) -->
  <text x="256" y="452" text-anchor="middle"
        font-family="'PingFang SC','Hiragino Sans GB','STHeiti','Songti SC',sans-serif"
        font-weight="600" font-size="112" fill="#FFFFFF"
        letter-spacing="6">京造</text>
</svg>